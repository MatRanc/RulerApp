name: RulerApp
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.matranc
  createIntermediateGroups: true
targets:
  RulerApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/RulerApp
    info:
      path: Sources/RulerApp/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: RulerApp
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matranc.rulerapp
        PRODUCT_NAME: RulerApp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
