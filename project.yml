name: RulerApp
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.matranc
  createIntermediateGroups: true
targets:
  RulerApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/RulerApp
    info:
      path: Sources/RulerApp/Info.plist
      properties:
        CFBundleName: Ruler App
        CFBundleDisplayName: Ruler App
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 Mathieu Rancourt. All rights reserved."
        NSHighResolutionCapable: true
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Sources/RulerApp/RulerApp.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matranc.RulerApp
        PRODUCT_NAME: RulerApp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: YES
